name: Update stats

on:
  schedule:
    - cron: "0 15 * * *" # 00:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate stats.svg
        run: node scripts/stats.mjs
        env:
          # Read-only token that can see your private repos. See README of scripts/stats.mjs.
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet || {
            git commit -m "chore: update stats"
            git pull --rebase
            git push
          }
